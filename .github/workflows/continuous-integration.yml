name: "Continuous integration"

on:
  push:
    branches:
      - "main"
    tags:
       - "*"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ci:
    name: "GLPI ${{ matrix.glpi-version }} - php:${{ matrix.php-version }} - ${{ matrix.db-image }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - glpi-version: "11.0.x"
            php-version: "8.2"
            db-image: "mariadb:10.6"
          - glpi-version: "12.0.x"
            php-version: "8.3"
            db-image: "mysql:8.0"
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/continuous-integration.yml@v1.30.3"
    with:
      plugin-key: "singlesignon"
      glpi-version: "${{ matrix.glpi-version }}"
      php-version: "${{ matrix.php-version }}"
      db-image: "${{ matrix.db-image }}"
      skip-changelog-check: true
      run-e2e-tests: false
